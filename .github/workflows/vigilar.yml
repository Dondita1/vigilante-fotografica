name: vigilar
on:
  schedule:
    - cron: '*/10 * * * *'   # cada 10 min (GitHub a veces demora unos minutos más)
  workflow_dispatch:
    inputs:
      url:
        description: 'URL a probar (dejar vacío = la real; poner una inexistente para probar los avisos)'
        required: false
        default: ''
permissions:
  contents: write   # para guardar el estado en el archivo `estado`
concurrency: vigilar
jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash vigilar.sh
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ inputs.url || 'https://fotografica.codestudio.com.ar/login' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_TELEFONO_ID: ${{ secrets.WA_TELEFONO_ID }}
          WA_DESTINO: ${{ secrets.WA_DESTINO }}
